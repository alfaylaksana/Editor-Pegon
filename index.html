<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor Pegon JSON</title>
<style>
:root{--g:#14532d;--g2:#1f7a45;--au:#b58a1b;--bg:#eff3ec;--c:#fff;--ln:#cbd6c8;--t:#1c2620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.4 system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--g);color:#fff;border:0;border-radius:6px;padding:7px 11px;cursor:pointer}
button.alt{background:#fff;color:var(--g);border:1px solid var(--g)}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--au);outline-offset:1px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:8px 10px;border-bottom:3px solid var(--au);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
header h1{font-size:16px;margin:0 auto 0 0;font-weight:600}
header h1 small{display:block;font-weight:400;font-size:12px;opacity:.85}
header button{background:#fff;color:var(--g)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px}
.bar label,.fr label{display:flex;gap:4px;align-items:center}
select{max-width:100%;padding:6px;border:1px solid var(--ln);border-radius:6px;background:#fff}
.panel{margin:6px 10px;background:var(--c);border:1px solid var(--ln);border-radius:8px;padding:10px}
.panel textarea{width:100%;height:110px;font:12px monospace}
details>summary{cursor:pointer;font-weight:600}
.fr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.fr input[type=text]{flex:1 1 140px;padding:6px;border:1px solid var(--ln);border-radius:6px}
main{padding:0 10px 65vh}
.bab{margin:14px 0 4px;color:var(--g);font-size:15px}
.card{background:var(--c);border:1px solid var(--ln);border-left:5px solid var(--g2);border-radius:8px;margin:8px 0;padding:8px}
.card.ch{border-left-color:var(--au)}
.hd{display:flex;gap:8px;align-items:center}
.hd b{color:var(--g)}
.tag{background:var(--au);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.trj{margin-top:6px}
.trj textarea{width:100%;min-height:48px;margin:3px 0;padding:6px;border:1px solid var(--ln);border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.row input{flex:1 1 200px;padding:6px;border:1px solid var(--ln);border-radius:6px;min-width:0}
.row .kd{flex:0 0 64px}
.row .ar{font:22px 'Scheherazade New','Amiri','Noto Naskh Arabic',serif;background:#f3f6f1}
.row .jw{font:20px 'Scheherazade New','Amiri','Noto Naskh Arabic',serif}
.act{display:flex;gap:4px;margin-left:auto}
.act button{padding:5px 8px}
.dt{flex:1 1 100%}.dt label{font-size:12px;color:#556;display:block}
.dt input,.dt textarea,.ed{display:block;width:100%;padding:6px;border:1px solid var(--ln);border-radius:6px;background:#fff}
.dt textarea{min-height:60px}.ed{min-height:60px}
.tb{display:flex;gap:4px;margin:3px 0}.tb button{padding:2px 9px}
.vis{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13px;width:100%}
.bar{position:sticky;top:var(--hh,56px);z-index:4;background:var(--bg);border-bottom:1px solid var(--ln)}
#nav{position:fixed;left:17px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:6;opacity:0;pointer-events:none;transition:opacity .3s}
#nav.on{opacity:1;pointer-events:auto}
#nav .pil{display:flex;flex-direction:column;background:#ffffff80;border:1px solid var(--au);border-radius:16px}
#nav button{position:relative;width:28px;height:25px;border:0;border-radius:0;background:transparent;color:#000;padding:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#nav button::after{content:'';position:absolute;top:0;bottom:0;left:-8px;right:-8px}
#nav button+button{border-top:1px solid #00000033}
#nav button:disabled{opacity:.3}
#nav svg{width:18px;height:18px;fill:currentColor}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:10px}
#mbox{background:#fff;border-radius:10px;padding:14px;width:min(560px,100%);max-height:92vh;overflow:auto}
#mbox input{width:100%;padding:6px;margin:3px 0;border:1px solid var(--ln);border-radius:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font:24px 'Scheherazade New','Amiri',serif;margin:8px 0}
.cut{background:#fff;color:#888;border:1px dashed #888;padding:2px 6px}
.cut.on{background:var(--au);color:#fff;border:1px solid var(--au)}
.hit{display:block;width:100%;text-align:left;background:#fff;color:var(--t);border:1px solid var(--ln);margin:3px 0;padding:5px 8px;font-size:13px}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:10}
</style></head>
<body>
<header><h1>Editor Pegon JSON<small id="info">Belum ada file dimuat</small></h1>
<button id="bLoad">Muat</button><button id="bUndo" disabled>Urungkan</button><button id="bDl" disabled>Unduh</button><button id="bCp" disabled>Salin</button></header>
<div id="pLoad" class="panel">
<div class="fr"><input type="file" id="file"><button id="bRestore" class="alt" style="display:none"></button></div>
<textarea id="paste" placeholder="Atau tempel isi JSON di sini"></textarea>
<div class="fr"><button id="bPaste">Muat dari tempelan</button></div></div>
<div id="tools" style="display:none">
<div class="bar"><button id="bPrev" class="alt" aria-label="Halaman sebelumnya">‹</button><select id="sel" aria-label="Pilih halaman"></select><button id="bNext" class="alt" aria-label="Halaman berikutnya">›</button>
<label><input type="checkbox" id="unlock"> Buka kunci Arab</label><label><input type="checkbox" id="onlyCh"> Hanya yang diubah</label><div class="vis" id="vis" aria-label="Tampilkan kolom"></div></div>
<details class="panel"><summary>Cari dan ganti</summary>
<div class="fr"><input type="text" id="q" placeholder="Cari"><input type="text" id="rep" placeholder="Ganti dengan"></div>
<div class="fr"><label><input type="checkbox" class="sc" value="maknaIndo" checked> Indo</label><label><input type="checkbox" class="sc" value="maknaJawa" checked> Pegon</label><label><input type="checkbox" class="sc" value="arab"> Arab</label><label><input type="checkbox" class="sc" value="indo"> Popup Indo</label><label><input type="checkbox" class="sc" value="en"> Popup Inggris</label><label><input type="checkbox" class="sc" value="tasrifan"> I'rab</label><label><input type="checkbox" class="sc" value="tashrif"> Tashrif</label><label><input type="checkbox" class="sc" value="kataTashrif"> Kata tashrif</label><label><input type="checkbox" class="sc" value="maknaAyat"> Tafsir</label><label><input type="checkbox" class="sc" value="catatan"> Catatan</label></div>
<div class="fr"><label><input type="checkbox" id="cs"> Huruf besar/kecil dibedakan</label><label><input type="checkbox" id="kw"> Kata utuh</label><button id="bFind">Cari</button><button id="bRep" class="alt">Ganti semua</button></div>
<div id="hits"></div></details></div>
<main id="main"></main>
<div id="nav"><div class="pil">
<button id="nAwal" aria-label="Ke awal halaman"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="3.5"/><polygon points="12,9.5 19.5,19.5 4.5,19.5"/></svg></button>
<button id="nAkhir" aria-label="Ke akhir halaman"><svg viewBox="0 0 24 24"><polygon points="4.5,4.5 19.5,4.5 12,14.5"/><rect x="5" y="17" width="14" height="3.5"/></svg></button></div>
<div class="pil">
<button id="nPrev" aria-label="Ayat sebelumnya"><svg viewBox="0 0 24 24"><polygon points="12,6 20.5,18 3.5,18"/></svg></button>
<button id="nNext" aria-label="Ayat berikutnya"><svg viewBox="0 0 24 24"><polygon points="3.5,6 20.5,6 12,18"/></svg></button></div></div>
<div id="modal"><div id="mbox"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let D=null,O=null,cur=0,undo=[],fname='gandul.json',dirtyF=false,tm;
const LS='gandulEditorDraft',POS='gandulEditorPos',KF=['arab','maknaIndo','maknaJawa','tasrifan','tashrif','kataTashrif','maknaAyat','catatan'];
const COLS=[['ar','Arab'],['in','Indo'],['jw','Pegon'],['kd','Kode'],['ir',"I'rab"],['ts','Tashrif'],['tf','Tafsir'],['ct','Catatan'],['tp','Popup']],VK='gandulEditorVis';
let V={ar:1,in:1,jw:1,kd:1,ir:0,ts:0,tf:0,ct:0,tp:1};
try{Object.assign(V,JSON.parse(localStorage.getItem(VK)||'{}'))}catch(e){}
function buildVis(){const v=$('#vis');v.textContent='';COLS.forEach(([c,l])=>{const i=el('input',{type:'checkbox'});i.checked=!!V[c];i.onchange=()=>{V[c]=i.checked?1:0;try{localStorage.setItem(VK,JSON.stringify(V))}catch(e){}rerender()};v.append(el('label',{},i,' '+l))})}
function el(t,a,...k){const e=document.createElement(t);for(const x in a||{}){if(x==='class')e.className=a[x];else if(x.slice(0,2)==='on')e[x]=a[x];else e.setAttribute(x,a[x])}e.append(...k.flat());return e}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',2200)}
const BSM='بسم الله الرحمن الرحيم';
function nrm(s){return(s||'').replace(/[\u064B-\u065F\u0610-\u061A\u0670\u06D6-\u06ED]/g,'').replace(/[ٱإأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim()}
function no1(v){return String(v||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim()==='1'}
function isBsm(L,g){return nrm(L.slice(g[0],g[1]+1).map(k=>k.arab).join(' '))===BSM}
function groups(b){const L=b.kataList,g=[];let s=0;L.forEach((k,i)=>{if(k.nomor||i===L.length-1){g.push([s,i]);s=i+1}});
// Basmalah di awal surah (selain Al-Fatihah) bukan bagian ayat 1: dipisah jadi kartu sendiri
if(String(b.nomorSurah||'').trim()==='1')return g;
const o=[];g.forEach(x=>{let cut=0;if(no1(L[x[1]].nomor))for(let n=2;n<=Math.min(x[1]-x[0],4);n++){if(nrm(L.slice(x[0],x[0]+n).map(k=>k.arab).join(' '))===BSM){cut=n;break}}
if(cut){o.push([x[0],x[0]+cut-1],[x[0]+cut,x[1]])}else o.push(x)});return o}
function findT(p,b,n){const T=p.terjemahan;if(!T||!n)return null;let k=(b.nomorSurah||'')+':'+n;if(T[k])return T[k];for(k in T)if(k.split(':')[1]===n)return T[k];return null}
function sig(p,b,gi){const g=p&&b&&b.kataList&&groups(b)[gi];if(!g)return'';return JSON.stringify([b.kataList.slice(g[0],g[1]+1),findT(p,b,b.kataList[g[1]].nomor)])}
function label(p,i){const n=[];(p.babList||[]).forEach(b=>(b.kataList||[]).forEach(k=>{if(k.nomor)n.push(k.nomor)}));const nm=(p.babList||[]).map(b=>b.namaBab).filter(Boolean).join('، ');return 'Hlm '+(i+1)+(nm?' · '+nm:'')+(n.length?' · ayat '+n[0]+'–'+n[n.length-1]:'')}
function dirty(){dirtyF=true;clearTimeout(dirty.t);dirty.t=setTimeout(save,600)}
function save(){try{localStorage.setItem(LS,JSON.stringify({n:fname,d:D,o:O,t:Date.now()}))}catch(e){}}
window.onbeforeunload=()=>dirtyF?'Ada perubahan yang belum diunduh.':undefined;
function push(){undo.push(JSON.stringify(D));if(undo.length>15)undo.shift();$('#bUndo').disabled=false}
function rerender(){const y=scrollY;render();scrollTo(0,y)}
function render(){const m=$('#main');m.textContent='';const p=D.halamanList[cur];if(!p)return;const only=$('#onlyCh').checked,op=O.halamanList[cur];let shown=0;
(p.babList||[]).forEach((b,bi)=>{if(!b.kataList)return;m.append(el('h3',{class:'bab'},'Bab '+(bi+1)+': '+(b.namaBab||'(tanpa nama)')+' (surah '+(b.nomorSurah||'-')+')'));
groups(b).forEach((g,gi)=>{const ch=sig(p,b,gi)!==sig(op,op&&op.babList&&op.babList[bi],gi);if(only&&!ch)return;shown++;m.append(card(p,b,bi,gi,g,ch))})});
if(only&&!shown)m.append(el('p',{},'Belum ada ayat yang diubah di halaman ini.'));
m.append(el('div',{class:'fr'},el('button',{class:'alt',onclick:()=>go(-1)},'‹ Halaman sebelumnya'),el('button',{class:'alt',onclick:()=>go(1)},'Halaman berikutnya ›')))}
function card(p,b,bi,gi,g,ch){const L=b.kataList,n=L[g[1]].nomor,t=findT(p,b,n);
const c=el('div',{class:'card'+(ch?' ch':''),id:'c-'+cur+'-'+bi+'-'+gi});
c.append(el('div',{class:'hd'},el('b',{},!n&&isBsm(L,g)?'Basmalah':'Ayat '+(n||'(tanpa nomor)')),ch?el('span',{class:'tag'},'diubah'):''));
if(t&&V.tp){const d=el('details',{class:'trj'},el('summary',{},'Terjemah popup'));for(const [f,lab] of [['indo','Indo'],['en','Inggris']]){const a=el('textarea',{spellcheck:'false','aria-label':lab});a.value=t[f]||'';a.oninput=()=>{t[f]=a.value;dirty()};d.append(el('div',{},lab+':'),a)}c.append(d)}
for(let i=g[0];i<=g[1];i++)c.append(row(b,i,L[i],i<g[1]));
return c}
function inp(k,f,cls,rtl,ro,ttl){const i=el('input',{class:cls,type:'text',spellcheck:'false',title:ttl,'aria-label':ttl});i.value=k[f]||'';if(rtl)i.dir='rtl';if(ro)i.readOnly=true;i.oninput=()=>{k[f]=i.value;dirty()};return i}
function dt(l,n){return el('div',{class:'dt'},el('label',{},l),n)}
function plain(k,f){const a=el('textarea',{spellcheck:'false'});a.value=k[f]||'';a.oninput=()=>{k[f]=a.value;dirty()};return a}
function safe(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,iframe,object,embed').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name))n.removeAttribute(a.name)}));return t.innerHTML}
function rich(k,f){const w=el('div',{}),ed=el('div',{class:'ed',contenteditable:'true',dir:'auto'}),ta=el('textarea',{style:'display:none;font:12px monospace;direction:ltr',spellcheck:'false'});
ed.innerHTML=safe(k[f]||'');ta.value=k[f]||'';
ed.oninput=()=>{k[f]=ed.innerHTML;ta.value=k[f];dirty()};ta.oninput=()=>{k[f]=ta.value;ed.innerHTML=safe(ta.value);dirty()};
const B=(t,fn)=>el('button',{class:'alt',type:'button',onmousedown:e=>{e.preventDefault();fn()}},t);
w.append(el('div',{class:'tb'},B('B',()=>document.execCommand('bold')),B('I',()=>document.execCommand('italic')),B('• Daftar',()=>document.execCommand('insertUnorderedList')),B('HTML',()=>{const h=ta.style.display==='none';ta.style.display=h?'block':'none';ed.style.display=h?'none':'block'})),ed,ta);return w}
function row(b,i,k,canJoin){const r=el('div',{class:'row'});
if(V.ar)r.append(inp(k,'arab','ar',1,!$('#unlock').checked,'Arab'));
if(V.in)r.append(inp(k,'maknaIndo','in',0,0,'Indo'));
if(V.jw)r.append(inp(k,'maknaJawa','jw',1,0,'Pegon'));
if(V.kd){const kd=inp(k,'kode','kd',0,0,'Kode');kd.placeholder='kode';r.append(kd)}
const ac=el('div',{class:'act'});if(canJoin)ac.append(el('button',{class:'alt',title:'Gabung dengan frasa di bawahnya',onclick:()=>join(b,i)},'⤵ Gabung'));
ac.append(el('button',{class:'alt',title:'Pisah frasa ini',onclick:()=>split(b,i)},'✂ Pisah'));r.append(ac);
if(V.ct)r.append(dt('Catatan',plain(k,'catatan')));
if(V.ir)r.append(dt("I'rab",rich(k,'tasrifan')));
if(V.ts)r.append(dt('Kata tashrif',inp(k,'kataTashrif','',0,0,'Kata tashrif')),dt('Tashrif',rich(k,'tashrif')));
if(V.tf)r.append(dt('Jumlah ayat tafsir (mis. 1-3)',inp(k,'maknaAyatJumlah','',0,0,'Jumlah ayat')),dt('Tafsir',rich(k,'maknaAyat')));
return r}
function join(b,i){push();const a=b.kataList[i],c=b.kataList[i+1],m=Object.assign({},a);
for(const f of KF)m[f]=[a[f],c[f]].map(v=>(v||'').trim()).filter(Boolean).join(' ');
m.kode=a.kode||c.kode||'';m.maknaAyatJumlah=a.maknaAyatJumlah||c.maknaAyatJumlah||'';m.nomor=c.nomor||'';b.kataList.splice(i,2,m);rerender();dirty()}
function tutup(){$('#modal').style.display='none'}
function split(b,i){const k=b.kataList[i],a=(k.arab||'').trim(),W=a.split(/\s+/).filter(Boolean),Lt=[...a.matchAll(/\P{M}\p{M}*/gu)].map(m=>m[0]);
if(Lt.length<2){toast('Frasa ini terlalu pendek untuk dipisah.');return}
let mode=W.length<2?1:0,cut=1,w=W;const box=$('#mbox');box.textContent='';const ch=el('div',{class:'chips',dir:'rtl'});
const paint=()=>{w=mode?Lt:W;if(cut>=w.length)cut=1;ch.textContent='';w.forEach((x,j)=>{ch.append(el('span',{},x.trim()?x:'\u00a0'));if(j<w.length-1)ch.append(el('button',{class:'cut'+(cut===j+1?' on':''),'aria-label':'Pisah setelah bagian '+(j+1),onclick:()=>{cut=j+1;paint()}},'✂'))})};
const mc=el('input',{type:'checkbox',style:'width:auto'});mc.checked=!!mode;mc.onchange=()=>{mode=mc.checked?1:0;cut=1;paint()};paint();
const f=(v,rtl)=>{const t=el('input',{type:'text'});t.value=v||'';if(rtl){t.dir='rtl';t.style.fontSize='20px'}return t};
const i1=f(k.maknaIndo),i2=f(''),j1=f(k.maknaJawa,1),j2=f('',1);
box.append(el('h3',{},'Pisah frasa'),el('label',{},mc,' Pisah di dalam kata (per huruf), mis. وَمَالِيَ → وَمَا | لِيَ'),el('div',{},'Pilih titik pisah (✂ kuning):'),ch,
el('div',{},'Indo bagian 1 dan 2 (pindahkan teks yang sesuai ke bagian 2):'),i1,i2,
el('div',{},'Pegon bagian 1 dan 2:'),j1,j2,
el('div',{class:'fr'},el('button',{onclick:()=>{push();const sp=mode?'':' ',
a1=Object.assign({},k,{arab:w.slice(0,cut).join(sp).trim(),maknaIndo:i1.value,maknaJawa:j1.value,nomor:''}),
c=Object.assign({},k,{arab:w.slice(cut).join(sp).trim(),maknaIndo:i2.value,maknaJawa:j2.value,kode:'',catatan:'',tasrifan:'',tashrif:'',kataTashrif:'',maknaAyat:'',maknaAyatJumlah:''});
b.kataList.splice(i,1,a1,c);tutup();rerender();dirty()}},'Pisahkan'),el('button',{class:'alt',onclick:tutup},'Batal')));
$('#modal').style.display='flex'}
function rx(){const q=$('#q').value;if(!q){toast('Isi kata yang dicari.');return null}
let s=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
if($('#kw').checked)s='(?<![\\p{L}\\p{N}\\p{M}])'+s+'(?![\\p{L}\\p{N}\\p{M}])';
return new RegExp(s,'gu'+($('#cs').checked?'':'i'))}
function each(fn){const on=$$('.sc').filter(c=>c.checked).map(c=>c.value);
D.halamanList.forEach((p,pi)=>(p.babList||[]).forEach((b,bi)=>{if(!b.kataList)return;groups(b).forEach((g,gi)=>{
for(let i=g[0];i<=g[1];i++)for(const f of on)if(KF.includes(f))fn(b.kataList[i],f,pi,bi,gi);
const t=findT(p,b,b.kataList[g[1]].nomor);if(t)for(const f of on)if(!KF.includes(f))fn(t,f,pi,bi,gi)})}))}
function jump(pi,bi,gi){cur=pi;$('#sel').value=pi;$('#onlyCh').checked=false;render();
const c=$('#c-'+pi+'-'+bi+'-'+gi);if(c){c.scrollIntoView({block:'center'});c.style.outline='3px solid var(--au)'}}
$('#bFind').onclick=()=>{const r=rx();if(!r)return;let n=0;const hits=[];
each((o,f,pi,bi,gi)=>{const v=o[f];if(typeof v!=='string')return;const m=v.match(r);if(!m)return;n+=m.length;if(hits.length<80)hits.push([pi,bi,gi,f,v])});
const H=$('#hits');H.textContent='';H.append(el('div',{},n+' kemunculan'+(hits.length>=80?' (80 isian pertama ditampilkan)':'')));
hits.forEach(([pi,bi,gi,f,v])=>H.append(el('button',{class:'hit',onclick:()=>jump(pi,bi,gi)},'Hlm '+(pi+1)+' · '+f+' · '+(v.length>70?v.slice(0,70)+'…':v))))};
$('#bRep').onclick=()=>{const r=rx();if(!r)return;const R=$('#rep').value;let n=0,fld=0;
each((o,f)=>{const v=o[f];if(typeof v==='string'&&v.match(r))fld++});
if(!fld){toast('Tidak ada yang cocok.');return}
if(!confirm('Ganti di '+fld+' isian? Masih bisa diurungkan.'))return;

function load(txt,name){let d;try{d=JSON.parse(txt)}catch(e){alert('JSON tidak valid: '+e.message);return}
if(!d||!Array.isArray(d.halamanList)||!d.halamanList.length){alert('Bukan format gandul: halamanList tidak ditemukan.');return}
D=d;O=JSON.parse(txt);undo=[];cur=0;fname=name||fname;start()}
function start(){const L=D.halamanList;let k=0;L.forEach(p=>(p.babList||[]).forEach(b=>k+=(b.kataList||[]).length));
$('#info').textContent=fname+' · '+L.length+' halaman · '+k+' kata';
const s=$('#sel');s.textContent='';L.forEach((p,i)=>s.append(el('option',{value:i},label(p,i))));s.value=cur;
$('#tools').style.display='block';$('#pLoad').style.display='none';$('#bDl').disabled=$('#bCp').disabled=false;$('#bUndo').disabled=!undo.length;document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');render();scrollTo(0,0)}
function go(d){const n=cur+d;if(n<0||n>=D.halamanList.length)return;cur=n;$('#sel').value=n;render();scrollTo(0,0)}
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result,f.name);r.readAsText(f)};
$('#bPaste').onclick=()=>load($('#paste').value,'tempelan.json');
$('#bLoad').onclick=()=>{const p=$('#pLoad');p.style.display=p.style.display==='none'?'block':'none'};
$('#sel').onchange=e=>{cur=+e.target.value;render();scrollTo(0,0)};
$('#bPrev').onclick=()=>go(-1);$('#bNext').onclick=()=>go(1);
$('#unlock').onchange=rerender;$('#onlyCh').onchange=rerender;
$('#bUndo').onclick=()=>{if(!undo.length)return;D=JSON.parse(undo.pop());$('#bUndo').disabled=!undo.length;rerender();save()};

$('#bDl').onclick=()=>{const a=el('a',{href:URL.createObjectURL(new Blob([out()],{type:'application/json'})),download:fname.replace(/\.json$/i,'')+'-edit.json'});document.body.append(a);a.click();a.remove();dirtyF=false;toast('File diunduh')};

// ── Tombol navigasi melayang: awal/akhir halaman & ayat sebelumnya/berikutnya ──
(function(){
const nav=$('#nav'),bA=$('#nAwal'),bZ=$('#nAkhir'),bP=$('#nPrev'),bN=$('#nNext');
let tm=null,held=false;
const line=()=>$('header').offsetHeight+$('.bar').offsetHeight+6;
const prevC=()=>{const A=line(),L=$$('.card');for(let i=L.length-1;i>=0;i--)if(L[i].getBoundingClientRect().top<A-3)return L[i];return null};
const nextC=()=>{const A=line();return $$('.card').find(c=>c.getBoundingClientRect().top>A+3)||null};
const lastC=()=>{const L=$$('.card');return L[L.length-1]||null};
const go=c=>{if(c)scrollBy({top:c.getBoundingClientRect().top-line(),behavior:'instant'})};
function upd(){const z=lastC();bP.disabled=!prevC();bN.disabled=!nextC();bA.disabled=scrollY<=2;bZ.disabled=!z||z.getBoundingClientRect().top<=line()+3}
function hide(){if(held){tm=setTimeout(hide,1500);return}nav.classList.remove('on')}
function show(){if(!D||!lastC())return;if(getComputedStyle($('#modal')).display!=='none')return;upd();nav.classList.add('on');clearTimeout(tm);tm=setTimeout(hide,5000)}
['touchstart','pointerdown','mousemove'].forEach(ev=>addEventListener(ev,show,{passive:true}));
addEventListener('scroll',show,{passive:true});
nav.addEventListener('pointerdown',()=>{held=true});
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>{held=false}));
bA.onclick=()=>scrollTo({top:0,behavior:'instant'});
bZ.onclick=()=>go(lastC());
bP.onclick=()=>go(prevC());
bN.onclick=()=>go(nextC());
})();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw-editor.js').catch(()=>{})})}
</script></body></html>
